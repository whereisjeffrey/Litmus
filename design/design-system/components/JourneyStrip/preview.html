<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Journey strip</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>body{margin:0;padding:20px 18px;background:var(--surface,#FFFFFF);font-family:Inter,system-ui,sans-serif;color:var(--ink,#1C2142)}
.strip{max-width:344px;display:flex;align-items:flex-start}
.step{display:flex;flex-direction:column;align-items:center;gap:5px;width:64px}
.node{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:4px 10px;font-family:"Baloo 2","Arial Rounded MT Bold",sans-serif;font-weight:700;font-size:13px}
.rule{flex-grow:1;height:2px;background:var(--line,#D9DBE6);margin-top:12px}
.lbl{font-size:10px;font-weight:600;color:var(--ink-soft,#454B6B)}
.tease{max-width:344px;margin:12px 0 0;font-size:12.5px;line-height:19px;color:var(--ink-soft,#454B6B)}</style>
</head>
<body>
<div class="strip">
  <div class="step"><span class="node" style="background:var(--chartreuse,#D7F056)">9</span><span class="lbl">Product</span></div>
  <span class="rule"></span>
  <div class="step"><span class="node" style="border:1.5px solid var(--line,#D9DBE6)"><svg width="9" height="9" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.5" y="6" width="9" height="6" rx="1.5" fill="none" stroke="var(--ink-soft,#454B6B)" stroke-width="1.6"/><path d="M4.5 6 V4.5 A2.5 2.5 0 0 1 9.5 4.5 V6" fill="none" stroke="var(--ink-soft,#454B6B)" stroke-width="1.6"/></svg>4</span><span class="lbl">Cart</span></div>
  <span class="rule"></span>
  <div class="step"><span class="node" style="border:1.5px solid var(--line,#D9DBE6)"><svg width="9" height="9" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.5" y="6" width="9" height="6" rx="1.5" fill="none" stroke="var(--ink-soft,#454B6B)" stroke-width="1.6"/><path d="M4.5 6 V4.5 A2.5 2.5 0 0 1 9.5 4.5 V6" fill="none" stroke="var(--ink-soft,#454B6B)" stroke-width="1.6"/></svg>6</span><span class="lbl">Account</span></div>
  <span class="rule"></span>
  <div class="step"><span class="node" style="border:1.5px solid var(--line,#D9DBE6)"><svg width="9" height="9" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.5" y="6" width="9" height="6" rx="1.5" fill="none" stroke="var(--ink-soft,#454B6B)" stroke-width="1.6"/><path d="M4.5 6 V4.5 A2.5 2.5 0 0 1 9.5 4.5 V6" fill="none" stroke="var(--ink-soft,#454B6B)" stroke-width="1.6"/></svg>5</span><span class="lbl">Pay</span></div>
  <span class="rule"></span>
  <div class="step"><span class="node" style="border:1.5px solid var(--line,#D9DBE6)"><svg width="9" height="9" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.5" y="6" width="9" height="6" rx="1.5" fill="none" stroke="var(--ink-soft,#454B6B)" stroke-width="1.6"/><path d="M4.5 6 V4.5 A2.5 2.5 0 0 1 9.5 4.5 V6" fill="none" stroke="var(--ink-soft,#454B6B)" stroke-width="1.6"/></svg>1</span><span class="lbl">Done</span></div>
</div>
<p class="tease">This page is step 1 of 5. <strong style="color:var(--ink,#1C2142)">16 more findings</strong> wait in the rest of the journey — including 3 promises made here that break later.</p>
</body>
</html>

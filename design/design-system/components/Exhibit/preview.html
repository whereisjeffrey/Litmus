<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exhibit</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;padding:18px;background:var(--surface,#FFFFFF);font-family:Inter,system-ui,sans-serif;color:var(--ink,#1C2142)}
.wrap{max-width:316px;display:flex;flex-direction:column;gap:6px}
.cap{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;letter-spacing:0.08em;color:var(--ink-faint,#6E7390)}
.frame{border:1.5px solid var(--ink,#1C2142);border-radius:10px;overflow:hidden;background:#FFFFFF}
.shot{padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:12px;color:#3A3F55}
.line{display:flex;justify-content:space-between}
.ring{position:relative;border:2px dashed var(--cobalt,#2440F0);border-radius:6px;margin:-5px;padding:3px 5px 3px}
</style>
</head>
<body>
<div class="wrap">
  <span class="cap">
    <svg width="11" height="11" viewBox="0 0 14 14" aria-hidden="true"><path d="M1.5 4 V2.5 A1 1 0 0 1 2.5 1.5 H4 M10 1.5 H11.5 A1 1 0 0 1 12.5 2.5 V4 M12.5 10 V11.5 A1 1 0 0 1 11.5 12.5 H10 M4 12.5 H2.5 A1 1 0 0 1 1.5 11.5 V10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    FROM YOUR CHECKOUT &#183; STEP 4
  </span>
  <div class="frame">
    <div class="shot">
      <div class="line"><span>Subtotal</span><span>$184.00</span></div>
      <div class="ring"><div class="line"><span style="font-weight:600">Shipping</span><span style="font-weight:700">$14.90</span></div></div>
      <div class="line" style="font-weight:700;color:#1C2142"><span>Total</span><span>$198.90</span></div>
    </div>
  </div>
  <span style="font-size:10.5px;color:var(--ink-soft,#454B6B)">Their pixels, our ring — the same dashed cobalt Show Me draws on the live page.</span>
</div>
</body>
</html>

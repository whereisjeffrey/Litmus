<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review badge</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
<style>body{margin:0;display:flex;gap:16px;align-items:center;padding:24px;background:var(--surface,#FFFFFF);font-family:Inter,system-ui,sans-serif}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--ink-soft,#454B6B)}
.outlined{font-size:10.5px;border:1.5px solid var(--line,#D9DBE6);border-radius:999px;padding:4px 10px}</style>
</head>
<body>
<span class="badge">
<svg width="11" height="11" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.5 L12 3.5 V7 C12 10 9.8 11.8 7 12.5 C4.2 11.8 2 10 2 7 V3.5 Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M4.8 7 L6.4 8.6 L9.2 5.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
survived review</span>
<span class="badge outlined">
<svg width="11" height="11" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.5 L12 3.5 V7 C12 10 9.8 11.8 7 12.5 C4.2 11.8 2 10 2 7 V3.5 Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M4.8 7 L6.4 8.6 L9.2 5.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
expert-reviewed</span>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buttons</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>body{margin:0;display:flex;gap:10px;align-items:center;padding:24px;background:var(--surface,#FFFFFF);font-family:Inter,system-ui,sans-serif;flex-wrap:wrap}
button{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:999px;padding:8px 14px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.dark{background:var(--ink,#1C2142);border-radius:14px;padding:10px 12px;display:flex}</style>
</head>
<body>
<button style="background:var(--cobalt,#2440F0);color:#FFFFFF">
<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8 C3.5 4.5 6 3 8 3 C10 3 12.5 4.5 14.5 8 C12.5 11.5 10 13 8 13 C6 13 3.5 11.5 1.5 8 Z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="2" fill="currentColor"/></svg>
Show me</button>
<button style="background:var(--surface,#FFFFFF);color:var(--ink-soft,#454B6B);border:1.5px solid var(--line,#D9DBE6)">
<svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.5" y="6" width="9" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 6 V4.5 A2.5 2.5 0 0 1 9.5 4.5 V6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
Why it survived</button>
<span class="dark"><button style="background:var(--chartreuse,#D7F056);color:var(--ink,#1C2142);font-weight:700">Unlock the full report</button></span>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Impact chip</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
<style>body{margin:0;display:flex;gap:10px;align-items:center;padding:24px;background:var(--surface,#FFFFFF);font-family:Inter,system-ui,sans-serif}
.chip{font-size:10px;font-weight:700;letter-spacing:0.04em;border-radius:999px;padding:3px 9px}</style>
</head>
<body>
<span class="chip" style="background:var(--impact-high,#FBD9D2);color:var(--impact-high-ink,#8C2A18)">HIGH</span>
<span class="chip" style="background:var(--impact-medium,#FBEBC2);color:var(--impact-medium-ink,#6E5200)">MEDIUM</span>
<span class="chip" style="background:var(--impact-low,#E9EBF2);color:var(--impact-low-ink,#3E4466)">LOW</span>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finding row</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600&family=Inter:wght@700&display=swap" rel="stylesheet">
<style>body{margin:0;padding:18px;background:var(--surface,#FFFFFF);font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;gap:10px}
.row{max-width:344px;display:flex;align-items:center;gap:10px;border:1.5px solid var(--ink,#1C2142);border-radius:16px;box-shadow:var(--shadow-card,3px 3px 0 rgba(28,33,66,0.10));padding:12px;background:var(--surface,#FFFFFF);cursor:pointer}
.chip{flex-shrink:0;font-size:10px;font-weight:700;letter-spacing:0.04em;border-radius:999px;padding:3px 9px}
.head{font-family:"Baloo 2","Arial Rounded MT Bold",sans-serif;font-weight:600;font-size:15px;line-height:19px;color:var(--ink,#1C2142)}</style>
</head>
<body>
<div class="row">
  <span class="chip" style="background:var(--impact-medium,#FBEBC2);color:var(--impact-medium-ink,#6E5200)">MEDIUM</span>
  <span class="head">&#8220;Final sale&#8221; badge contradicts the free-returns hero</span>
  <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" style="margin-left:auto;flex-shrink:0"><path d="M4 2.5 L8.5 6 L4 9.5" fill="none" stroke="var(--ink-soft,#454B6B)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
<div class="row">
  <span class="chip" style="background:var(--impact-low,#E9EBF2);color:var(--impact-low-ink,#3E4466)">LOW</span>
  <span class="head">Review sort leads with your angriest customer</span>
  <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" style="margin-left:auto;flex-shrink:0"><path d="M4 2.5 L8.5 6 L4 9.5" fill="none" stroke="var(--ink-soft,#454B6B)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
</body>
</html>

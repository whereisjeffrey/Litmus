<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pro ledger</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;padding:18px;background:var(--surface,#FFFFFF);font-family:Inter,system-ui,sans-serif}
.ledger{max-width:344px;background:var(--ink,#1C2142);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.pill{align-self:flex-start;font-family:"Baloo 2","Arial Rounded MT Bold",sans-serif;font-weight:700;font-size:12px;background:var(--chartreuse,#D7F056);color:var(--ink,#1C2142);border-radius:999px;padding:3px 12px}
h2{margin:0;font-family:"Baloo 2","Arial Rounded MT Bold",sans-serif;font-weight:700;font-size:18px;line-height:23px;color:#FFFFFF}
.row{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.12)}
.row span{font-size:12.5px;line-height:18px;color:var(--on-dark-body,#E8EBFF)}
.row b{margin-left:auto;font-family:"Baloo 2",sans-serif;font-weight:700;font-size:16px;color:var(--chartreuse,#D7F056)}
.honest{margin:0;font-size:11px;line-height:16px;color:var(--on-dark-muted,#AEB4D9)}
button{background:var(--chartreuse,#D7F056);color:var(--ink,#1C2142);border:none;border-radius:999px;padding:11px 16px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer}</style>
</head>
<body>
<div class="ledger">
  <span class="pill">pro</span>
  <h2>Already found. Waiting for you.</h2>
  <div>
    <div class="row"><span>Exact fixes with rewritten copy</span><b>9</b></div>
    <div class="row"><span>Findings across cart &#8594; account &#8594; pay</span><b>16</b></div>
    <div class="row"><span>Promises that break between pages</span><b>3</b></div>
    <div class="row" style="border-bottom:none"><span>Adversary verdicts, reasoning included</span><b>13</b></div>
  </div>
  <p class="honest">These counts are real — we already found them. The lock is only on the details.</p>
  <button>Unlock the full report</button>
</div>
</body>
</html>
